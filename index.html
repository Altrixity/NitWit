
<html>
    <head>
        <title>Nitwit | Streamline Coding Languages</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h2>NITWIT</h2>
            <img width="100px" height="auto" src="Logo.png">
        </header>
      <div class="NoticeBox">
        <h1>Nitwit is still under development</h1>
      </div>
      <div class="center-wrapper">
  <div class="app-container">
    <div class="box left-box">
      <p>Nit.Type("stream")</p>
    </div>

    <div class="box right-box">
      <div class="tabs-container">
        <button class="tab-btn active" id="btn-1">Batch</button>
        <button class="tab-btn" id="btn-2">Html</button>
      </div>
      
      <div class="content-state active" id="content-1">
        <h2>To be changed</h2>
      </div>

      <div class="content-state" id="content-2">
        <h2>&lt!DOCTYPE html&gt</h2>
        <p>fsfsf<br>f<br>a<br>f<br>g<br>a<br>g</p>
      </div>
    </div>
  </div>
</div>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background-color: #000000;
  }

  .center-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    box-sizing: border-box;
  }

  .app-container {
    display: flex;
    gap: 60px;
    padding: 60px 60px 80px 60px;
    font-family: sans-serif;
  }

  .box {
    background-color: #bc00bc;
    color: #ffffff;
    width: 550px;
    min-height: 650px;
    padding: 45px;
    font-size: 22px;
    box-sizing: border-box;
    position: relative;
  }

  .right-box {
    overflow: visible;
  }

  .tabs-container {
    position: absolute;
    top: -55px;
    left: 0;
    display: flex;
    gap: 20px;
  }

  .tab-btn {
    background-color: #940094;
    color: #000000;
    border: none;
    padding: 12px 36px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
  }

  .tab-btn.active {
    background-color: #bc00bc;
  }

  .content-state {
    display: none;
  }

  .content-state.active {
    display: block;
  }

  .content-state h2 {
    margin-top: 0;
    font-size: 36px;
  }

  .content-state p {
    margin: 30px 0 0 0;
    line-height: 1.5;
  }
</style>

<script>
  const button1 = document.getElementById('btn-1');
  const button2 = document.getElementById('btn-2');
  const content1 = document.getElementById('content-1');
  const content2 = document.getElementById('content-2');

  button1.addEventListener('click', () => {
    button1.classList.add('active');
    button2.classList.remove('active');
    content1.classList.add('active');
    content2.classList.remove('active');
  });

  button2.addEventListener('click', () => {
    button2.classList.add('active');
    button1.classList.remove('active');
    content2.classList.add('active');
    content1.classList.remove('active');
  });
</script>
    </body>
</html>
