
<html>
    <head>
        <title>Nitwit | Streamline Coding Languages</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h2>NITWIT</h2>
            <img width="100px" height="auto" src="Logo.png">
        </header>
      <div class="NoticeBox">
        <h1>Nitwit is still under development</h1>
      </div>
      <div class="container">

  <!-- Block 1 -->
  <div class="box">
    <textarea placeholder="Type in box 1..."></textarea>
  </div>

  <!-- Block 2 (tabs) -->
  <div class="box">

    <div class="tabs">
      <button class="active" onclick="switchTab(0)">Tab 1</button>
      <button onclick="switchTab(1)">Tab 2</button>
      <button onclick="switchTab(2)">Tab 3</button>
    </div>

    <div class="tab-content" id="tabContent">
      This is Tab 1 content.
    </div>

  </div>

</div>
<script>
const tabs = [
  "This is Tab 1 content.",
  "This is Tab 2 content.",
  "This is Tab 3 content."
];

function switchTab(index) {
  document.getElementById("tabContent").textContent = tabs[index];

  const buttons = document.querySelectorAll(".tabs button");
  buttons.forEach((btn, i) => {
    btn.classList.toggle("active", i === index);
  });
}
</script>
    </body>
</html>
