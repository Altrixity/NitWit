
<html>
    <head>
        <title>Nitwit | Streamline Coding Languages</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h2>NITWIT</h2>
            <img width="100px" height="auto" src="Logo.png">
        </header>
      <div class="NoticeBox">
        <h1>Nitwit is still under development</h1>
      </div>
      <div class="app-container">
  <div class="box left-box">
    <h2>Blah blah blah</h2>
  </div>

  <div class="box right-box">
    <div class="tabs-container">
      <button class="tab-btn active" id="btn-1">button</button>
      <button class="tab-btn" id="btn-2">button 2</button>
    </div>
    <div class="dynamic-content" id="dynamic-text">
      <h2>Blah blah blah</h2>
    </div>
  </div>
</div>

<style>
  .app-container {
    display: flex;
    gap: 40px;
    background-color: #000000;
    padding: 50px;
    font-family: sans-serif;
  }

  .box {
    background-color: #bc00bc;
    color: #ffffff;
    width: 400px;
    min-height: 450px;
    padding: 30px;
    box-sizing: border-box;
    position: relative;
  }

  .right-box {
    overflow: visible;
  }

  .tabs-container {
    position: absolute;
    top: -40px;
    left: 0;
    display: flex;
    gap: 15px;
  }

  .tab-btn {
    background-color: #940094;
    color: #000000;
    border: none;
    padding: 8px 24px;
    font-size: 16px;
    cursor: pointer;
  }

  .tab-btn.active {
    background-color: #bc00bc;
  }

  .dynamic-content h2 {
    margin-top: 0;
  }

  .dynamic-content p {
    margin: 20px 0 0 0;
    line-height: 1.4;
  }
</style>

<script>
  const button1 = document.getElementById('btn-1');
  const button2 = document.getElementById('btn-2');
  const contentArea = document.getElementById('dynamic-text');

  const content1 = `
    <h2>Blah blah blah</h2>
  `;

  const content2 = `
    <h2>blah blah blah 2</h2>
    <p>fsfsf<br>f<br>a<br>f<br>g<br>a<br>g</p>
  `;

  button1.addEventListener('click', () => {
    contentArea.innerHTML = content1;
    button1.classList.add('active');
    button2.classList.remove('active');
  });

  button2.addEventListener('click', () => {
    contentArea.innerHTML = content2;
    button2.classList.add('active');
    button1.classList.remove('active');
  });
</script>
    </body>
</html>
